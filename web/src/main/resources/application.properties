# ============================================================
# CAFELEAF AI - SPRING BOOT CONFIGURATION (MySQL + YOLO11)
# ============================================================
spring.application.name=cafeleaf-web
server.port=8080

# MySQL 8.0 / MySQL Workbench Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/cafeleaf_db?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration (Auto-create/update tables in MySQL Workbench)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Multipart File Upload Limits (Support high-res leaf photos & batch of 5 images)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=50MB

# Static Resources & Uploads (Read directly from src/main/resources/static for live reload)
spring.web.resources.static-locations=file:src/main/resources/static/,classpath:/static/
spring.web.resources.cache.period=0
cafeleaf.upload.dir=uploads
cafeleaf.yolo.python-path=../venv/Scripts/python.exe
cafeleaf.yolo.script-path=python_bridge/yolo_infer.py
cafeleaf.yolo.model-path=models/best.pt
